# dsh-dev-env bundle patch — mounts the Host half and the Client half into a profile.
#
# You never edit a profile by hand: the package manager performs the insertion.
#
#   dsh plugin --profile <profile> add dsh-dev-env
#   dsh plugin --profile <profile> add github:cszi666/dsh-dev-env
#
# Local development against a checkout:
#
#   dsh plugin --profile <profile> add link:<absolute path to this directory>
- insert:
    - id: dev-env
      name: 'dsh-dev-env'
